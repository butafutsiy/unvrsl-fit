<!doctype html>
<html lang="ru"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050505"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>UNVRSL FIT</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
:root{--bg:#050505;--card:#1b1b1d;--card2:#242426;--line:#333337;--text:#f7f7f8;--muted:#99999f;--green:#32d45b;--orange:#ff9f0a}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}body{min-height:100vh;padding-bottom:100px}
button,.button,input{font:inherit}button,.button{border:0;border-radius:14px;padding:11px 13px;background:#29292c;color:#fff;font-weight:700;text-decoration:none}.primary{background:var(--green);color:#071108}.full{width:100%;margin-top:16px}
.top{padding:56px 20px 15px;position:sticky;top:0;background:linear-gradient(#050505 78%,rgba(5,5,5,0));z-index:20}.brand{font-size:35px;font-weight:850;letter-spacing:-1.4px}.sub{color:var(--muted);margin-top:3px}
.page{display:none;padding:0 16px 24px}.page.active{display:block}.card{background:var(--card);border:1px solid #242426;border-radius:24px;padding:18px;margin:12px 0}.hero{border-left:4px solid var(--green)}h2{font-size:25px;margin:6px 0 8px}h3{margin:4px 0 6px;font-size:18px}.muted{color:var(--muted)}small{color:#86868c}
.row{display:flex;align-items:center;gap:12px}.between{justify-content:space-between}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:15px}.eyebrow,.sect{font-size:13px;color:#777;text-transform:uppercase;letter-spacing:.08em}.sect{margin:22px 4px 7px}
.twocol{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{background:var(--card2);border-radius:20px;padding:16px}.metric span{display:block;color:var(--muted)}.metric b{display:block;font-size:27px;margin:7px 0}.metric button{padding:8px 9px;font-size:12px}
.nav{position:fixed;left:0;right:0;bottom:0;padding:8px 7px calc(9px + env(safe-area-inset-bottom));background:rgba(10,10,10,.96);border-top:1px solid #1d1d20;display:grid;grid-template-columns:repeat(5,1fr);z-index:50;backdrop-filter:blur(18px)}.nav button{background:none;color:#777;padding:5px;font-size:11px}.nav button.active{color:var(--green)}.ico{display:block;font-size:21px;margin-bottom:3px}.nav .center .ico{width:54px;height:54px;border-radius:50%;background:var(--green);color:#071108;display:grid;place-items:center;margin:-29px auto 3px;font-size:23px;box-shadow:0 0 28px rgba(50,212,91,.23)}
.weekbar{display:flex;gap:7px;overflow:auto;padding:4px 0 6px}.weekbar button{min-width:47px;border:1px solid #303035;background:#171719;color:#aaa}.weekbar button.on{background:var(--green);color:#071108;border-color:transparent}.routine{border-left:4px solid var(--green)}.meta{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}.chip{display:inline-flex;padding:6px 9px;border-radius:999px;background:#29292d;color:#ddd;font-size:12px}.chip.green{background:rgba(50,212,91,.14);color:var(--green)}.chip.orange{background:rgba(255,159,10,.14);color:#ffb53b}
.exercise{background:#202023;border:1px solid #2b2b2f;border-radius:21px;padding:15px;margin:10px 0}.exercise.method{border-color:#51411f;background:#211f18}.sethead,.setrow{display:grid;grid-template-columns:28px 1fr 1fr 1fr 40px;gap:7px;align-items:center}.sethead{font-size:11px;color:#777;text-align:center;margin-top:10px}.setrow{margin-top:7px}.setrow>span{text-align:center;color:#777}.setrow input{width:100%;background:#121214;border:1px solid #343438;border-radius:11px;padding:9px 6px;color:#fff;text-align:center}.setrow button{width:38px;height:38px;padding:0;border:1px solid #3b3b40;background:#171719;color:#777}.setrow button.done{background:var(--green);color:#071108;border-color:var(--green)}
.bar{height:8px;background:#29292d;border-radius:999px;overflow:hidden;margin-top:12px}.bar i{display:block;height:100%;background:var(--green)}.line{padding:13px 0;border-bottom:1px solid #2d2d30}.biginput{width:100%;background:#111;border:1px solid #333;border-radius:15px;padding:15px;color:#fff;font-size:26px;margin:12px 0}
svg{width:100%;height:150px}.modal{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:80;display:none;align-items:flex-end}.modal.show{display:flex}.sheet{width:100%;max-height:88vh;overflow:auto;background:#18181a;border-radius:28px 28px 0 0;padding:20px 18px calc(25px + env(safe-area-inset-bottom))}
.timer{position:fixed;left:16px;right:16px;bottom:91px;background:#242427;border:1px solid #35353a;border-radius:21px;padding:13px 15px;z-index:70;display:none;align-items:center;justify-content:space-between;box-shadow:0 10px 35px #000}.timer.show{display:flex}.timer b{font-size:28px}.toast{position:fixed;top:58px;left:50%;transform:translateX(-50%);background:#29292c;border:1px solid #3c3c40;border-radius:999px;padding:10px 14px;z-index:100;display:none;white-space:nowrap}.toast.show{display:block}
@media(min-width:760px){.page,.top{max-width:760px;margin:auto}.nav{left:50%;transform:translateX(-50%);max-width:760px}.timer{max-width:728px;left:50%;right:auto;transform:translateX(-50%);width:calc(100% - 32px)}}
</style></head><body>
<header class=top><div class=brand>UNVRSL FIT</div><div id=date class=sub></div></header>
<main><section id=home class="page active"></section><section id=plan class=page></section><section id=start class=page></section><section id=stats class=page></section><section id=settings class=page></section></main>
<nav class=nav><button data-p=home class=active><span class=ico>⌂</span>Главная</button><button data-p=plan><span class=ico>▣</span>План</button><button data-p=start class=center><span class=ico>🏋</span>Старт</button><button data-p=stats><span class=ico>▥</span>Статистика</button><button data-p=settings><span class=ico>⚙</span>Настройки</button></nav>
<div id=timer class=timer><div><div class=muted>Отдых</div><b id=tt>01:30</b></div><div class=row><button onclick=add30()>+30</button><button onclick=stopTimer()>Стоп</button></div></div>
<div id=modal class=modal onclick="if(event.target===this)closeModal()"><div id=sheet class=sheet></div></div><div id=toast class=toast></div>
<script src="plan-w1.js"></script><script src="plan-w2.js"></script><script src="plan-w3.js"></script><script src="plan-w4.js"></script><script src="plan-w5.js"></script><script src="plan-w6.js"></script><script src="plan-w7.js"></script><script src="plan-w8.js"></script><script src="app.js"></script>
<script>if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));</script>
</body></html>
