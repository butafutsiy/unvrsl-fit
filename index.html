<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#050505">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="UNVRSL FIT">
  <title>UNVRSL FIT</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="v11/app.css">
</head>
<body>
  <div id="boot" class="boot" aria-live="polite">
    <strong>UNVRSL FIT</strong>
    <i aria-hidden="true"></i>
    <span>Загрузка данных</span>
  </div>
  <div id="app" class="app" hidden>
    <header class="topbar">
      <div><div class="brand">UNVRSL FIT</div><div id="todayLabel" class="muted"></div></div>
      <button id="settingsButton" class="icon-button" aria-label="Настройки">⚙︎</button>
    </header>
    <main id="view" class="view"></main>
    <nav class="nav" aria-label="Основная навигация">
      <button data-page="home"><span>⌂</span>Главная</button>
      <button data-page="plan"><span>▣</span>План</button>
      <button data-page="workout" class="start"><span>▶</span>Старт</button>
      <button data-page="stats"><span>▥</span>Статистика</button>
      <button data-page="profile"><span>♙</span>Профиль</button>
    </nav>
  </div>
  <div id="modal" class="modal" hidden><div id="sheet" class="sheet" role="dialog" aria-modal="true"></div></div>
  <div id="toast" class="toast" hidden></div>
  <script src="plan-w1.js"></script>
  <script src="plan-w2.js"></script>
  <script src="plan-w3.js"></script>
  <script src="plan-w4.js"></script>
  <script src="plan-w5.js"></script>
  <script src="plan-w6.js"></script>
  <script src="plan-w7.js"></script>
  <script src="plan-w8.js"></script>
  <script src="cloud-config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js" crossorigin="anonymous"></script>
  <script type="module" src="v11/app.mjs"></script>
</body>
</html>
