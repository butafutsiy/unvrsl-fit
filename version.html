<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light dark"><title>UNVRSL FIT · проверка обновлений</title>
<style>*,*:before,*:after{box-sizing:border-box}body{font:16px -apple-system,BlinkMacSystemFont,Inter,system-ui,sans-serif;max-width:500px;margin:0 auto;padding:calc(35px + env(safe-area-inset-top)) 20px 35px;line-height:1.5;background:#f5f5f7;color:#171923}h1{font-size:27px;line-height:1.1;letter-spacing:-.04em}p{color:#687080}.panel{background:white;padding:20px;border-radius:20px;border:1px solid #e4e4e9;margin:18px 0}.row{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid #f0f0f2;padding:11px 0}.row:last-child{border:0}.row b{text-align:right}.good{color:#267948}.warn{color:#a35a00}button,a.action{appearance:none;display:block;width:100%;background:#171923;color:white;text-align:center;border:0;padding:14px;border-radius:14px;text-decoration:none;font:700 15px inherit;cursor:pointer}button{font-weight:750;margin-bottom:10px}.small{font-size:12px}.hint{font-size:13px;color:#586070}.code{font-variant-numeric:tabular-nums;font-weight:750}@media(prefers-color-scheme:dark){body{background:#121216;color:#fff}.panel{background:#1c1c22;border-color:#303039}.row{border-color:#303039}button,a.action{background:#bf5af2;color:#121216}p,.hint{color:#a3a3b1}.good{color:#7bc79a}.warn{color:#ffbd6a}}</style></head><body>
<h1>UNVRSL FIT</h1><p>Проверка опубликованной версии. Эта страница ничего не удаляет и не меняет в тренировках.</p>
<div class="panel">
<div class="row"><span>Ожидаемая версия</span><b class="code">v564</b></div>
<div class="row"><span>Версия на сервере</span><b class="code" id="server">Проверяю…</b></div>
<div class="row"><span>Установленный обработчик</span><b class="code" id="worker">Проверяю…</b></div>
<div class="row"><span>Результат</span><b id="result">Проверяю…</b></div>
</div>
<button type="button" id="check">Проверить снова</button>
<a class="action" href="./?update=564">Открыть UNVRSL FIT</a>
<p class="hint" id="hint">Проверка обращается к серверу, а не к данным ваших тренировок.</p>
<script>
(function(){
 const by=id=>document.getElementById(id);
 async function check(){
  by('server').textContent='Проверяю…';by('result').textContent='Проверяю…';
  let version=null;
  try{
   const r=await fetch('./sw.js?diagnostic='+Date.now(),{cache:'no-store'});
   if(!r.ok)throw Error('HTTP '+r.status);
   const m=(await r.text()).match(/SW_RELEASE\s*=\s*["'](v\d+)["']/);
   version=m?.[1]||null;
   by('server').textContent=version||'Не найдена';
  }catch(e){by('server').textContent='Не удалось проверить';}
  try{
   const reg=await navigator.serviceWorker?.getRegistration('./');
   by('worker').textContent=reg?.active?.scriptURL?.split('/').pop()?.split('?')[1]|| (reg?.active?'Активен':'Не установлен');
  }catch(e){by('worker').textContent='Неизвестно';}
  const ok=version==='v564';
  by('result').textContent=ok?'Код v564 доступен':'Сервер пока не отдаёт v564';
  by('result').className=ok?'good':'warn';
  by('hint').textContent=ok?'Если установленное приложение всё ещё старое, причина в обновлении iOS PWA. Не удаляйте приложение и данные сайта до резервного копирования.':'Если эта страница открылась, но версия не v564, нужно проверить GitHub Pages и публикацию main.';
 }
 by('check').addEventListener('click',check);check();
})();
</script></body></html>
