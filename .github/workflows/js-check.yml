name: Check JavaScript

on:
  push:
    branches: [main, "release/v1.1"]
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check v11/core.mjs
          node --check v11/store.mjs
          node --check v11/cloud.mjs
          node --check v11/app.mjs
          node --test tests/*.test.mjs
          node scripts/build-v11.mjs
