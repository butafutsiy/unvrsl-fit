name: Check JavaScript

on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          for file in *.js; do
            echo "Checking $file"
            node --check "$file"
          done
      - name: Test all current contracts
        run: node --test tests/*.test.cjs
      - name: Install isolated DOM test dependencies
        run: npm install --prefix "$RUNNER_TEMP/unvrsl-tests" --no-audit --no-fund jsdom@26.1.0 @napi-rs/canvas@0.1.80
      - name: Verify meal recommendations and nutrition diary
        run: |
          UNVRSL_JSDOM="$RUNNER_TEMP/unvrsl-tests/node_modules/jsdom" \
          node tests/runtime-meal-planner.cjs
          UNVRSL_JSDOM="$RUNNER_TEMP/unvrsl-tests/node_modules/jsdom" \
          node tests/runtime-meal-protocol.cjs
          UNVRSL_JSDOM="$RUNNER_TEMP/unvrsl-tests/node_modules/jsdom" \
          node tests/runtime-meal-catalog.cjs
          UNVRSL_JSDOM="$RUNNER_TEMP/unvrsl-tests/node_modules/jsdom" \
          node tests/runtime-meal-products.cjs
          UNVRSL_JSDOM="$RUNNER_TEMP/unvrsl-tests/node_modules/jsdom" \
          node tests/runtime-meal-search.cjs
          UNVRSL_JSDOM="$RUNNER_TEMP/unvrsl-tests/node_modules/jsdom" \
          node tests/runtime-meal-online.cjs
          UNVRSL_JSDOM="$RUNNER_TEMP/unvrsl-tests/node_modules/jsdom" \
          node tests/runtime-recipe-builder.cjs
          UNVRSL_JSDOM="$RUNNER_TEMP/unvrsl-tests/node_modules/jsdom" \
          node tests/runtime-nutrition-units.cjs
          UNVRSL_JSDOM="$RUNNER_TEMP/unvrsl-tests/node_modules/jsdom" \
          node tests/runtime-client-save.cjs
          UNVRSL_JSDOM="$RUNNER_TEMP/unvrsl-tests/node_modules/jsdom" \
          node tests/runtime-public-weight-goal.cjs
      - name: Verify weight history after late sign-in
        run: |
          UNVRSL_JSDOM="$RUNNER_TEMP/unvrsl-tests/node_modules/jsdom" \
          node tests/runtime-bodyweight-history.cjs
          UNVRSL_JSDOM="$RUNNER_TEMP/unvrsl-tests/node_modules/jsdom" \
          node tests/runtime-home-activity.cjs
      - name: Verify equipment tonnage across history and statistics
        run: |
          UNVRSL_JSDOM="$RUNNER_TEMP/unvrsl-tests/node_modules/jsdom" \
          node tests/runtime-tonnage.cjs
          UNVRSL_JSDOM="$RUNNER_TEMP/unvrsl-tests/node_modules/jsdom" \
          node tests/runtime-client-progress-v521.cjs
          UNVRSL_JSDOM="$RUNNER_TEMP/unvrsl-tests/node_modules/jsdom" \
          node tests/runtime-paired-load.cjs
          UNVRSL_JSDOM="$RUNNER_TEMP/unvrsl-tests/node_modules/jsdom" \
          node tests/runtime-per-leg-reps.cjs
      - name: Verify muscle recommendations and full catalog replacement
        run: |
          UNVRSL_JSDOM="$RUNNER_TEMP/unvrsl-tests/node_modules/jsdom" \
          node tests/runtime-exercise-replacement.cjs
          UNVRSL_JSDOM="$RUNNER_TEMP/unvrsl-tests/node_modules/jsdom" \
          node tests/runtime-weight-rounding.cjs
      - name: Verify six story layouts and native PNG sharing
        run: |
          UNVRSL_CANVAS="$RUNNER_TEMP/unvrsl-tests/node_modules/@napi-rs/canvas" \
          node tests/runtime-story-layouts.cjs
      - name: Verify unified equipment strength statistics
        run: |
          UNVRSL_JSDOM="$RUNNER_TEMP/unvrsl-tests/node_modules/jsdom" \
          node tests/runtime-strength-equipment.cjs
      - name: Verify offline history and trainer weekly loads
        run: |
          UNVRSL_JSDOM="$RUNNER_TEMP/unvrsl-tests/node_modules/jsdom" \
          node tests/runtime-offline-history.cjs
      - name: Verify complete workout scenario
        run: |
          UNVRSL_JSDOM="$RUNNER_TEMP/unvrsl-tests/node_modules/jsdom" \
          UNVRSL_CANVAS="$RUNNER_TEMP/unvrsl-tests/node_modules/@napi-rs/canvas" \
          node tests/runtime-v392.cjs
      - name: Verify all eight weeks and method recommendations
        run: |
          UNVRSL_JSDOM="$RUNNER_TEMP/unvrsl-tests/node_modules/jsdom" \
          node tests/runtime-methods-v438.cjs
      - name: Verify iOS quota recovery and navigation
        run: |
          UNVRSL_JSDOM="$RUNNER_TEMP/unvrsl-tests/node_modules/jsdom" \
          node tests/runtime-storage-v393.cjs
      - name: Verify adaptive recommendation interface
        run: |
          UNVRSL_JSDOM="$RUNNER_TEMP/unvrsl-tests/node_modules/jsdom" \
          node tests/runtime-focus-calibration.cjs
          UNVRSL_JSDOM="$RUNNER_TEMP/unvrsl-tests/node_modules/jsdom" \
          node tests/runtime-focus-metrics.cjs
          UNVRSL_JSDOM="$RUNNER_TEMP/unvrsl-tests/node_modules/jsdom" \
          node tests/runtime-focus-warmup.cjs
          UNVRSL_JSDOM="$RUNNER_TEMP/unvrsl-tests/node_modules/jsdom" \
          node tests/runtime-adaptive-load.cjs
          UNVRSL_JSDOM="$RUNNER_TEMP/unvrsl-tests/node_modules/jsdom" \
          node tests/runtime-weekly-calculated-weight.cjs
          UNVRSL_JSDOM="$RUNNER_TEMP/unvrsl-tests/node_modules/jsdom" \
          node tests/runtime-equipment-steps.cjs
          UNVRSL_JSDOM="$RUNNER_TEMP/unvrsl-tests/node_modules/jsdom" \
          node tests/runtime-equipment-delivery-v520.cjs
      - name: Verify canonical cycle editor and training launch
        run: |
          UNVRSL_JSDOM="$RUNNER_TEMP/unvrsl-tests/node_modules/jsdom" \
          UNVRSL_CANVAS="$RUNNER_TEMP/unvrsl-tests/node_modules/@napi-rs/canvas" \
          node tests/runtime-periodization.cjs
          UNVRSL_JSDOM="$RUNNER_TEMP/unvrsl-tests/node_modules/jsdom" \
          node tests/runtime-percentage-weeks.cjs
          UNVRSL_JSDOM="$RUNNER_TEMP/unvrsl-tests/node_modules/jsdom" \
          node tests/runtime-semen-plan.cjs
          UNVRSL_JSDOM="$RUNNER_TEMP/unvrsl-tests/node_modules/jsdom" \
          node tests/runtime-builtin-engine-cycle.cjs
          UNVRSL_JSDOM="$RUNNER_TEMP/unvrsl-tests/node_modules/jsdom" \
          node tests/runtime-eight-week-cycle.cjs
          UNVRSL_JSDOM="$RUNNER_TEMP/unvrsl-tests/node_modules/jsdom" \
          node tests/runtime-cycle-settings.cjs
      - name: Verify saved programs, re-import and trash recovery
        run: |
          UNVRSL_JSDOM="$RUNNER_TEMP/unvrsl-tests/node_modules/jsdom" \
          node tests/runtime-program-recovery.cjs
          UNVRSL_JSDOM="$RUNNER_TEMP/unvrsl-tests/node_modules/jsdom" \
          node tests/runtime-program-modes.cjs
          UNVRSL_JSDOM="$RUNNER_TEMP/unvrsl-tests/node_modules/jsdom" \
          node tests/runtime-template-visibility.cjs
          UNVRSL_JSDOM="$RUNNER_TEMP/unvrsl-tests/node_modules/jsdom" \
          node tests/runtime-load-policy-audit.cjs
          UNVRSL_JSDOM="$RUNNER_TEMP/unvrsl-tests/node_modules/jsdom" \
          node tests/runtime-individual-load-policies.cjs
          UNVRSL_JSDOM="$RUNNER_TEMP/unvrsl-tests/node_modules/jsdom" \
          node tests/runtime-management-cleanup.cjs
      - name: Audit traceable nutrition catalog
        run: node scripts/audit-nutrition.cjs
      - name: Audit catalog fields
        run: |
          node scripts/audit-exercises.cjs
          node scripts/audit-load-policies.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workout-verification
          path: |
            docs/runtime-v392.json
            docs/exercise-audit-v392.json
            docs/share-fixture-v392.png
  catalog-completeness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require media for every canonical exercise
        run: node scripts/audit-exercises.cjs --strict
  mobile-layout:
    # Playwright 1.56 Chromium is not supported on ubuntu-26.04 runners.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install real browser checks
        run: |
          npm install --prefix "$RUNNER_TEMP/unvrsl-browser" --no-audit --no-fund playwright@1.56.1
          npx --prefix "$RUNNER_TEMP/unvrsl-browser" playwright install --with-deps chromium
      - name: Build production shell
        run: node scripts/build-static.cjs
      - name: Check floating navigation, scroll, hit targets and offline PWA
        env:
          UNVRSL_AUDIT_URL: http://127.0.0.1:8770/unvrsl-fit/
        run: |
          mkdir -p "$RUNNER_TEMP/unvrsl-static"
          ln -s "$GITHUB_WORKSPACE/dist" "$RUNNER_TEMP/unvrsl-static/unvrsl-fit"
          python3 -m http.server 8770 --directory "$RUNNER_TEMP/unvrsl-static" > "$RUNNER_TEMP/unvrsl-layout-server.log" 2>&1 &
          for attempt in {1..50}; do
            curl -fsS "$UNVRSL_AUDIT_URL" -o /dev/null 2>/dev/null && break
            sleep .1
          done
          export UNVRSL_PLAYWRIGHT="$RUNNER_TEMP/unvrsl-browser/node_modules/playwright"
          export UNVRSL_AUDIT_OUTPUT="$RUNNER_TEMP/unvrsl-layout-proof"
          node tests/browser-program-audit.cjs
          node tests/browser-pwa-persistence.cjs
          node tests/browser-management-cleanup.cjs
          node tests/browser-home-activity.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-layout-proof
          path: ${{ runner.temp }}/unvrsl-layout-proof
