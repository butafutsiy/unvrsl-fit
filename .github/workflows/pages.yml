name: Deploy UNVRSL FIT to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate JavaScript
        run: |
          for file in *.js; do
            node --check "$file"
          done
      # Production is gated by current canonical prescription and persistence
      # contracts. The complete legacy suite remains visible in Check JavaScript;
      # its historical per-session volume and v546 cache fixtures need migration.
      - name: Test release-critical workout integrity
        run: |
          node --test \
            tests/periodization-table.test.js \
            tests/legacy-copy-periodization.test.js \
            tests/owner-rope-pushdown-volume.test.js \
            tests/program-day-effort-v545.test.cjs \
            tests/program-save.test.cjs \
            tests/program-flow-v386.test.cjs \
            tests/program-parameter-overrides-v381.test.cjs
      - name: Require complete canonical catalog
        run: |
          node scripts/audit-exercises.cjs --strict
          node scripts/audit-load-policies.cjs
      - name: Require verified nutrition catalog
        run: node scripts/audit-nutrition.cjs
      - name: Build public static application
        run: node scripts/build-static.cjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
