name: Deploy UNVRSL FIT to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
      - name: Checkout stable v1.1
        uses: actions/checkout@v4
        with:
          ref: release/v1.1
          path: stable-source
      - name: Validate JavaScript
        run: |
          for file in *.js; do
            node --check "$file"
          done
          node --test tests/*.test.cjs
          for file in stable-source/*.js; do
            node --check "$file"
          done
          node --test stable-source/tests/*.test.cjs
      - name: Assemble main and stable sites
        run: |
          mkdir -p _site/v1.1
          rsync -a --exclude='.git' --exclude='.github' --exclude='tests' --exclude='_site' --exclude='stable-source' ./ _site/
          rsync -a --exclude='.git' --exclude='.github' --exclude='tests' stable-source/ _site/v1.1/
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
